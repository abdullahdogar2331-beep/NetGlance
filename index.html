<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetGlance</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#f5f5f7;font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh}.top{height:68px;border-bottom:1px solid #242432;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#0b0b12ee;backdrop-filter:blur(14px);z-index:5}
.logo{font-size:26px;font-weight:900;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b);-webkit-background-clip:text;color:transparent}.layout{display:grid;grid-template-columns:210px 1fr 250px;gap:24px;padding:24px}.side{position:sticky;top:92px;height:max-content}.side button{width:100%;text-align:left;background:none;border:0;color:#bbb;padding:14px;border-radius:12px;margin:3px 0}.side button:hover,.side button.active{background:#1b1927;color:#fff}.feed{max-width:620px;width:100%;margin:auto}.card{background:#14131d;border:1px solid #242331;border-radius:18px;margin-bottom:18px;overflow:hidden}.pad{padding:15px}.user{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:grid;place-items:center;font-weight:800}.postimg{width:100%;height:390px;object-fit:cover;background:#20202c}.actions{display:flex;gap:16px;padding:12px 15px}.icon{border:0;background:none;color:#eee;font-size:22px}.muted{color:#8f8c9c;font-size:13px}.composer{padding:15px;background:#14131d;border:1px solid #242331;border-radius:18px;margin-bottom:18px}.composer input,.composer textarea,.modal input{width:100%;background:#0d0c13;color:#fff;border:1px solid #302e3d;border-radius:12px;padding:12px;margin:6px 0}.btn{border:0;border-radius:12px;padding:11px 17px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:white;font-weight:700}.outline{background:none;border:1px solid #363344}.rightbox{background:#14131d;border:1px solid #242331;border-radius:16px;padding:15px;position:sticky;top:92px}.person{display:flex;align-items:center;gap:9px;padding:10px 0}.spacer{flex:1}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:20px}.modalbox{background:#15141f;border:1px solid #302e3d;border-radius:20px;padding:24px;width:min(420px,100%)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}.empty{text-align:center;padding:60px 20px;color:#999}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#252333;padding:12px 18px;border-radius:12px;display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side,.rightbox{display:none}.layout{padding:12px}.top{padding:0 14px}.feed{max-width:650px}.postimg{height:330px}}
</style></head><body><div class="app">
<header class="top"><div class="logo">NetGlance</div><button class="btn outline" id="logout">Reset Demo</button></header>
<div class="layout"><nav class="side">
<button class="active" data-page="home">🏠 Home</button><button data-page="explore">🔎 Explore</button><button data-page="create">➕ Create</button><button data-page="messages">💬 Messages</button><button data-page="profile">👤 Profile</button>
</nav><main class="feed" id="main"></main><aside class="rightbox"><b>Suggested for you</b><div id="suggest"></div></aside></div></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='netglance_demo_final';let S=JSON.parse(localStorage.getItem(KEY)||'null');if(!S){S={me:{name:'Abdullah',user:'abdullah',bio:'Welcome to NetGlance 👋'},users:[{name:'Sarah Khan',user:'sarah',bio:'Creator & photographer'},{name:'Ali Raza',user:'aliraza',bio:'Tech enthusiast'},{name:'Hassan',user:'hassan',bio:'Travel & lifestyle'}],posts:[],likes:[],messages:[]};localStorage.setItem(KEY,JSON.stringify(S))}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),main=document.getElementById('main'),modal=document.getElementById('modal'),toast=document.getElementById('toast');
const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function avatar(name){return '<div class="avatar">'+esc(name[0]||'N')+'</div>'}
function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}
function postCard(p){let liked=S.likes.includes(p.id);return '<article class="card"><div class="pad user">'+avatar(p.user)+'<div><b>@'+esc(p.user)+'</b><div class="muted">'+esc(p.time)+'</div></div></div><img class="postimg" src="'+esc(p.img)+'"><div class="actions"><button class="icon like" data-id="'+p.id+'">'+(liked?'❤️':'🤍')+'</button><button class="icon comment" data-id="'+p.id+'">💬</button><button class="icon share" data-id="'+p.id+'">↗</button></div><div class="pad"><b>'+S.likes.filter(x=>x===p.id).length+'</b> likes<br><b>@'+esc(p.user)+'</b> '+esc(p.caption)+'</div></article>'}
function home(){main.innerHTML='<div class="composer"><b>Share something</b><input id="posttext" placeholder="What is on your mind?"><input id="postimg" placeholder="Image URL (optional)"><button class="btn" id="publish">Post</button></div>'+(S.posts.length?S.posts.map(postCard).join(''):'<div class="empty">No posts yet.<br>Create your first NetGlance post above.</div>');document.getElementById('publish').onclick=()=>{let c=document.getElementById('posttext').value.trim();if(!c)return notify('Write something first');S.posts.unshift({id:Date.now(),user:S.me.user,caption:c,img:document.getElementById('postimg').value.trim()||'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=80',time:'just now'});save();home();notify('Post published')};wire()}
function explore(){main.innerHTML='<h2>Explore</h2><input id="search" placeholder="Search people..." style="width:100%;padding:13px;background:#14131d;border:1px solid #302e3d;color:white;border-radius:12px"><div id="people"></div><h2>Latest posts</h2>'+S.posts.map(postCard).join('');const draw=()=>{let q=document.getElementById('search').value.toLowerCase();document.getElementById('people').innerHTML=S.users.filter(u=>(u.name+u.user).toLowerCase().includes(q)).map(u=>'<div class="card pad user">'+avatar(u.name)+'<div><b>'+esc(u.name)+'</b><div class="muted">@'+esc(u.user)+'</div></div><button class="btn spacer follow">Follow</button></div>').join('')};document.getElementById('search').oninput=draw;draw();wire()}
function create(){main.innerHTML='<h2>Create post</h2><div class="composer"><textarea id="cc" rows="6" placeholder="Write your post..."></textarea><input id="ci" placeholder="Image URL (optional)"><button class="btn" id="cp">Publish</button></div>';document.getElementById('cp').onclick=()=>{let c=document.getElementById('cc').value.trim();if(!c)return notify('Write something first');S.posts.unshift({id:Date.now(),user:S.me.user,caption:c,img:document.getElementById('ci').value.trim()||'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1000&q=80',time:'just now'});save();home();notify('Published')}}
function messages(){main.innerHTML='<h2>Messages</h2>'+S.users.map(u=>'<div class="card pad user"><div>'+avatar(u.name)+'</div><div><b>'+esc(u.name)+'</b><div class="muted">@'+esc(u.user)+'</div></div><button class="btn spacer msg" data-user="'+u.user+'">Message</button></div>').join('');document.querySelectorAll('.msg').forEach(b=>b.onclick=()=>chat(b.dataset.user))}
function chat(user){let u=S.users.find(x=>x.user===user),arr=S.messages.filter(m=>m.to===user||m.from===user);modal.style.display='grid';document.getElementById('modalbox').innerHTML='<h3>Chat with '+esc(u.name)+'</h3><div style="height:250px;overflow:auto">'+(arr.map(m=>'<p><b>@'+esc(m.from)+'</b>: '+esc(m.text)+'</p>').join('')||'<p class="muted">No messages yet.</p>')+'</div><input id="mt" placeholder="Message..."><button class="btn" id="send">Send</button> <button class="btn outline" id="close">Close</button>';document.getElementById('close').onclick=()=>modal.style.display='none';document.getElementById('send').onclick=()=>{let t=document.getElementById('mt').value.trim();if(!t)return;S.messages.push({from:S.me.user,to:user,text:t});save();chat(user)}}
function profile(){main.innerHTML='<div class="card pad"><div class="user">'+avatar(S.me.name)+'<div><h2 style="margin:0">'+esc(S.me.name)+'</h2><div class="muted">@'+esc(S.me.user)+'</div></div></div><p>'+esc(S.me.bio)+'</p><button class="btn" id="edit">Edit profile</button></div><h3>Your posts</h3><div class="grid">'+S.posts.filter(p=>p.user===S.me.user).map(p=>'<img src="'+esc(p.img)+'">').join('')+'</div>'}
function wire(){document.querySelectorAll('.like').forEach(b=>b.onclick=()=>{let id=+b.dataset.id;S.likes.includes(id)?S.likes=S.likes.filter(x=>x!==id):S.likes.push(id);save();home()});document.querySelectorAll('.comment').forEach(b=>b.onclick=()=>notify('Comments coming next'));document.querySelectorAll('.share').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(location.href);notify('Link copied')})}
function go(p){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));({home,explore,create,messages,profile}[p])()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('logout').onclick=()=>{localStorage.removeItem(KEY);location.reload()};go('home');
</script></body></html>
